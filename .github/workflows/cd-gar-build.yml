name: CD - Build and Push to GAR

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish Deployment Approval'
        required: true
        default: false
        type: boolean
      image_tag:
        description: 'Optional image tag. Defaults to short SHA.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  on-failure:
    if: ${{ github.event.inputs.deploy == 'false' }}
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo 'Deployment not approved'
          exit 1

  build:
    if: ${{ github.event.inputs.deploy == 'true' }}
    name: Build docker image
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set image tag
        id: vars
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy

      - name: Install toolchain (nightly)
        run: rustup toolchain add nightly --component rustfmt --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@cross

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rundler binaries
        run: |
          sudo -E env "PATH=$PATH" make build-x86_64-unknown-linux-gnu
          mkdir -p dist/bin/amd64
          cp target/x86_64-unknown-linux-gnu/release/rundler dist/bin/amd64/rundler

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          token_format: access_token
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          access_token_lifetime: 3600s

      - uses: docker/login-action@v3
        with:
          registry: '${{ vars.GCP_REGION }}-docker.pkg.dev'
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_GAR_REPOSITORY }}/${{ vars.GCP_GAR_PACKAGE }}"
          docker buildx build --file ./Dockerfile.cross . \
            --platform linux/amd64 \
            --tag "$IMAGE:${{ steps.vars.outputs.image_tag }}" \
            --provenance=false \
            --push
